<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="LiCoEx - Online Code Executor for Python, JavaScript, and Java">
    <meta name="keywords" content="code executor, online compiler, python, javascript, java">
    <title>LiCoEx - Code Executor</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.47.0/min/vs/loader.min.js"></script>

    <script src="https://js.puter.com/v2/"></script>
</head>

<body>
    <header class="header">
        <div class="logo">
            <div class="logo-icon">L</div>
            <span class="logo-text">LiCoEx</span>
        </div>
        <div class="header-actions">
            <button class="btn-theme" id="themeToggle" title="Toggle Theme">
                <span class="theme-icon">🌙</span>
            </button>
            <div class="stat-item">
                <div class="status-indicator" id="serverStatus"></div>
                <span class="stat-value" id="serverStatusText">Connected</span>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="panel">
            <div class="panel-header">
                <span class="panel-title">Code</span>
                <div class="controls">
                    <div class="select-wrapper">
                        <select id="languageSelect">
                            <option value="python">Python</option>
                            <option value="javascript">JavaScript</option>
                            <option value="java">Java</option>
                            <option value="c">C</option>
                            <option value="cpp">C++</option>
                        </select>
                    </div>
                    <button class="btn-run" id="runBtn" onclick="runCode()">
                        <span id="runBtnText">Run</span>
                    </button>
                    <button class="btn-share" id="shareBtn" onclick="shareCode()">
                        <span>Share</span>
                    </button>
                </div>
            </div>
            <div class="editor-container">
                <div id="monacoEditor"></div>
            </div>
            <div class="input-section">
                <div class="input-header">
                    <span>Input (stdin)</span>
                    <span class="input-hint">If your code takes input, add it here</span>
                </div>
                <textarea class="input-textarea" id="stdinInput" placeholder="Enter input here..."
                    spellcheck="false"></textarea>
            </div>
        </div>

        <div class="panel output-panel">
            <div class="panel-header">
                <span class="panel-title">Output</span>
            </div>
            <div class="output-content" id="outputContent">
                <div class="empty-state" id="emptyState">
                    <div class="empty-state-icon">></div>
                    <div class="empty-state-text">Run your code to see output here</div>
                </div>
            </div>
        </div>
    </main>

    <div id="shareModal" class="modal" style="display: none;">
        <div class="modal-overlay" onclick="closeShareModal()"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2>Share Code Snippet</h2>
                <button class="modal-close" onclick="closeShareModal()">×</button>
            </div>
            <div class="modal-body">
                <div id="shareStatusMessage" class="share-status"></div>
                <div class="share-url-container">
                    <label>Your Share Link:</label>
                    <div class="url-input-group">
                        <input type="text" id="shareUrlInput" readonly class="share-url-input">
                        <button class="btn-copy" onclick="copyToClipboard()">Copy</button>
                    </div>
                </div>
                <div class="share-actions">
                    <button class="btn-primary" onclick="closeShareModal()">Done</button>
                </div>
            </div>
        </div>
    </div>

    <div id="errorModal" class="modal" style="display: none;">
        <div class="modal-overlay" onclick="closeErrorModal()"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2>Error</h2>
                <button class="modal-close" onclick="closeErrorModal()">×</button>
            </div>
            <div class="modal-body">
                <p id="errorMessage"></p>
                <div class="share-actions">
                    <button class="btn-primary" onclick="closeErrorModal()">OK</button>
                </div>
            </div>
        </div>
    </div>

    <button class="btn-back-to-editor" id="backToEditorBtn" onclick="scrollToEditor()" aria-label="Scroll back to editor">
        ↑ Editor
    </button>

    <script src="js/app.js"></script>
</body>

</html>
