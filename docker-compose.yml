services:
  app:
    build: .
    ports:
      - "8007:8007"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - MONGODB_URL=${MONGODB_URL}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-licoex_db}
      - REDIS_URL=${REDIS_URL}
      - EXECUTION_SANDBOX_IMAGE=${EXECUTION_SANDBOX_IMAGE:-licoex-sandbox:latest}
      - EXECUTION_SANDBOX_MEMORY=${EXECUTION_SANDBOX_MEMORY:-256m}
      - EXECUTION_SANDBOX_CPUS=${EXECUTION_SANDBOX_CPUS:-1.0}
      - EXECUTION_SANDBOX_PIDS_LIMIT=${EXECUTION_SANDBOX_PIDS_LIMIT:-64}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
